name: Remove GitHub from homepage comparison
on:
  push:
    branches: [remove-github-home-sim]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove misleading GitHub comparison
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/api/main.ts')
          s=p.read_text()
          old='            <button class="sim-tab" type="button" data-sim-source="github">GitHub</button>\n'
          assert old in s
          s=s.replace(old,'')
          old_demo="        github:{name:'GitHub issue',url:'github.com/example/project/issues/…',question:'Review this GitHub issue and suggest the next fix to try.',fail:'I can’t reliably inspect the full Issue thread from the URL alone. Paste the Issue body and comments and I can review it.',lead:'The Issue points to one likely failure path and one missing diagnostic.',points:['The report is reproducible only after reconnecting.','Comments narrow the failure to state carried between requests.','The next useful step is instrumenting the reconnect path before changing behavior.']},\n"
          assert old_demo in s
          s=s.replace(old_demo,'')
          s=s.replace('homeonly1','homeonly2')
          p.write_text(s)

          t=Path('test/runtime-smoke.mjs')
          s=t.read_text()
          s=s.replace("['youtube','tiktok','instagram','x','bluesky','github','hn','pdf','web']","['youtube','tiktok','instagram','x','bluesky','hn','pdf','web']")
          s=s.replace("['reddit','youtube','tiktok','instagram','x','bluesky','github','hn','pdf','web']","['reddit','youtube','tiktok','instagram','x','bluesky','hn','pdf','web']")
          s=s.replace("simTab('github').listeners.click();","simTab('hn').listeners.click();")
          s=s.replace("assert.match(ids['sim-url'].textContent,/github\\.com/,'source tabs must switch simulation content');","assert.match(ids['sim-url'].textContent,/news\\.ycombinator\\.com/,'source tabs must switch simulation content');")
          s=s.replace('homeonly1','homeonly2')
          t.write_text(s)
      - name: Validate
        run: npm ci && npm test
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/remove-github-home-sim.yml
          git config user.name "Link2AI Homepage Fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/api/main.ts test/runtime-smoke.mjs .github/workflows/remove-github-home-sim.yml
          git commit -m "Remove GitHub from homepage comparison"
          git push origin HEAD:remove-github-home-sim
