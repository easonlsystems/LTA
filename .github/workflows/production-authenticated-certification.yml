name: Production authenticated API certification

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-authenticated-certification
  cancel-in-progress: true

jobs:
  api-lifecycle:
    # Automatic runs stay visibly skipped until certification credentials have
    # actually been configured and the repository variable is enabled.
    # Manual runs always execute so missing credentials still fail loudly rather
    # than producing a fake successful certification.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.LINK2AI_AUTH_CERT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require certification credentials
        env:
          CERT_URL: ${{ secrets.LINK2AI_PRODUCTION_URL }}
          CERT_EMAIL: ${{ secrets.LINK2AI_CERT_EMAIL }}
          CERT_PASSWORD: ${{ secrets.LINK2AI_CERT_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$CERT_URL" || -z "$CERT_EMAIL" || -z "$CERT_PASSWORD" ]]; then
            echo "::error::Authenticated production certification requires LINK2AI_PRODUCTION_URL, LINK2AI_CERT_EMAIL, and LINK2AI_CERT_PASSWORD secrets. No live checks ran."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Certify account lifecycle and live sources
        env:
          LINK2AI_PRODUCTION_URL: ${{ secrets.LINK2AI_PRODUCTION_URL }}
          LINK2AI_CERT_EMAIL: ${{ secrets.LINK2AI_CERT_EMAIL }}
          LINK2AI_CERT_PASSWORD: ${{ secrets.LINK2AI_CERT_PASSWORD }}
          LINK2AI_CERT_SOURCE_URL: ${{ secrets.LINK2AI_CERT_SOURCE_URL }}
          LINK2AI_CERT_INSTAGRAM_URL: ${{ secrets.LINK2AI_CERT_INSTAGRAM_URL }}
          LINK2AI_CERT_GITHUB_URL: ${{ secrets.LINK2AI_CERT_GITHUB_URL }}
          LINK2AI_CERT_INSTAGRAM_IMAGE_URL: ${{ secrets.LINK2AI_CERT_INSTAGRAM_IMAGE_URL }}
          LINK2AI_EXPECTED_REVISION: ${{ github.sha }}
        run: node test/production-authenticated-cert.mjs
