name: R8 sync smoke

on:
  push:
    branches:
      - r8-hero-founder-metrics-20260916

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply smoke sync
        run: python3 scripts/r8_fix_test.py
      - name: Install
        run: npm ci
      - name: Full regression
        run: npm test
      - name: Commit validated smoke sync
        run: |
          git config user.name "easonsystems"
          git config user.email "easonlsy1019@gmail.com"
          git rm .github/workflows/r8-sync-smoke.yml scripts/r8_fix_test.py
          git add test/runtime-smoke.mjs
          git diff --cached --check
          git commit -m "Sync runtime smoke with intentional hero wrapping"
          git push origin HEAD:r8-hero-founder-metrics-20260916
