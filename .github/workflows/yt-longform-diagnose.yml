name: YouTube long-form diagnostic
on:
  push:
    branches: [home-density-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install newer yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'yt-dlp[default,curl-cffi]==2026.8.29.232711.dev0'
          yt-dlp --version
      - name: Probe user video and known long-form control
        shell: bash
        run: |
          set +e
          probe_url() {
            label="$1"; url="$2"
            echo "######## $label :: $url ########"
            for mode in default impersonate mweb-default web-safari-default android-vr-default; do
              echo "===== $mode ====="
              rm -f /tmp/yt.json /tmp/yt.err
              args=()
              case "$mode" in
                impersonate) args=(--impersonate chrome) ;;
                mweb-default) args=(--extractor-args 'youtube:player_client=mweb,default') ;;
                web-safari-default) args=(--extractor-args 'youtube:player_client=web_safari,default') ;;
                android-vr-default) args=(--extractor-args 'youtube:player_client=android_vr,default') ;;
              esac
              yt-dlp --js-runtimes node --dump-single-json --skip-download --no-playlist --no-warnings "${args[@]}" "$url" >/tmp/yt.json 2>/tmp/yt.err
              rc=$?
              echo "rc=$rc"
              sed -n '1,80p' /tmp/yt.err
              if [ "$rc" -eq 0 ]; then
                python -c "import json; d=json.load(open('/tmp/yt.json')); print('id=',d.get('id')); print('title=',d.get('title')); print('duration=',d.get('duration')); print('webpage_url=',d.get('webpage_url')); print('auto_caps=',list((d.get('automatic_captions') or {}).keys())[:5])"
                break
              fi
            done
          }
          probe_url user-link 'https://www.youtube.com/watch?v=jJiw4CdAanw'
          probe_url public-long-control 'https://www.youtube.com/watch?v=aqz-KE-bpKQ'
          echo '--- oEmbed user link ---'
          curl -sS -o /tmp/oembed.out -w 'HTTP %{http_code}\n' 'https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DjJiw4CdAanw&format=json'
          head -c 800 /tmp/oembed.out; echo
          exit 0
