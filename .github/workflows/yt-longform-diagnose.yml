name: YouTube long-form diagnostic
on:
  push:
    branches: [home-density-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public YouTube endpoints
        shell: bash
        run: |
          set +e
          ID='jJiw4CdAanw'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          echo '--- oEmbed ---'
          curl -L -A "$UA" -sS -D /tmp/oe.h -o /tmp/oe.json "https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D$ID&format=json"
          head -1 /tmp/oe.h; head -c 600 /tmp/oe.json; echo
          echo '--- watch page ---'
          curl -L -A "$UA" -sS -D /tmp/watch.h -o /tmp/watch.html "https://www.youtube.com/watch?v=$ID&hl=en"
          head -1 /tmp/watch.h
          wc -c /tmp/watch.html
          python - <<'PY'
import re,html,json
s=open('/tmp/watch.html',encoding='utf-8',errors='ignore').read()
print('has_id=', 'jJiw4CdAanw' in s)
print('has_captionTracks=', 'captionTracks' in s)
print('has_player_response=', 'ytInitialPlayerResponse' in s)
for key in ['playabilityStatus','captionTracks']:
    i=s.find(key)
    print(key,'index=',i)
    if i>=0: print(s[max(0,i-200):i+1200].replace('\\u0026','&')[:1400])
PY
          echo '--- timedtext track list ---'
          curl -L -A "$UA" -sS -D /tmp/tt.h -o /tmp/tt.xml "https://www.youtube.com/api/timedtext?type=list&v=$ID"
          head -1 /tmp/tt.h; wc -c /tmp/tt.xml; head -c 1200 /tmp/tt.xml; echo
          exit 0
