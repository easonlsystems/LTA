name: YouTube long-form diagnostic
on:
  push:
    branches: [home-density-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current and newer yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'yt-dlp[default,curl-cffi]==2026.8.29.232711.dev0'
          yt-dlp --version
      - name: Probe exact failing long-form video across clients
        shell: bash
        run: |
          set +e
          URL='https://www.youtube.com/watch?v=jJiw4CdAanw'
          probe() {
            name="$1"; shift
            echo "===== $name ====="
            rm -f /tmp/yt.json /tmp/yt.err
            yt-dlp --js-runtimes node --dump-single-json --skip-download --no-playlist --no-warnings "$@" "$URL" >/tmp/yt.json 2>/tmp/yt.err
            rc=$?
            echo "rc=$rc"
            sed -n '1,120p' /tmp/yt.err
            if [ "$rc" -eq 0 ]; then
              python - <<'PY'
import json
p='/tmp/yt.json'
d=json.load(open(p))
print('id=',d.get('id'))
print('title=',d.get('title'))
print('duration=',d.get('duration'))
print('webpage_url=',d.get('webpage_url'))
print('subtitles=',list((d.get('subtitles') or {}).keys())[:8])
print('automatic_captions=',list((d.get('automatic_captions') or {}).keys())[:8])
PY
            fi
          }
          probe default
          probe impersonate --impersonate chrome
          probe mweb-default --extractor-args 'youtube:player_client=mweb,default'
          probe web-safari-default --extractor-args 'youtube:player_client=web_safari,default'
          probe android-vr-default --extractor-args 'youtube:player_client=android_vr,default'
          exit 0
