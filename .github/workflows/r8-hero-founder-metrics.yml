name: R8 hero and Founder metrics

on:
  push:
    branches:
      - r8-hero-founder-metrics-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply R8 patch
        run: python3 scripts/r8_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Run full regression
        run: npm test

      - name: Commit validated R8 patch
        run: |
          git config user.name "easonsystems"
          git config user.email "easonlsy1019@gmail.com"
          git rm .github/workflows/r8-hero-founder-metrics.yml scripts/r8_patch.py
          git add src/api/main.ts
          git diff --cached --check
          git commit -m "Fix hero wrapping and prioritize Founder metrics"
          git push origin HEAD:r8-hero-founder-metrics-20260916
