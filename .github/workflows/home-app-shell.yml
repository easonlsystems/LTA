name: Home app shell

on:
  push:
    branches:
      - home-app-shell

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-app-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply homepage architecture update
        run: python .github/scripts/home_app_shell2.py
      - name: Update app-shell regression contracts
        run: python .github/scripts/home_app_shell_tests.py
      - name: Verify page architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/api/main.ts').read_text()
          a=s.index("app.get('/',async(req,reply)=>{")
          b=s.index('const homeExperienceJs=',a)
          home=s[a:b]
          assert 'story-bridge' not in home
          assert 'source-experience' not in home
          assert 'usecase-experience' not in home
          assert 'proof-experience' not in home
          assert 'home-pricing' not in home
          assert 'home-only' in home
          assert 'min-height:100svh' in s
          assert 'href="/examples"' in s
          assert 'href="/use-cases"' in s
          assert 'href="/sources"' in s
          assert "app.get('/examples'" in s
          assert "app.get('/use-cases'" in s
          assert "app.get('/sources'" in s
          PY
      - run: npm ci
      - run: npm test
      - name: Commit validated update
        run: |
          rm .github/workflows/home-app-shell.yml
          rm .github/scripts/home_app_shell.py
          rm .github/scripts/home_app_shell2.py
          rm .github/scripts/home_app_shell_tests.py
          git config user.name 'Link2AI UI Polish'
          git config user.email 'actions@users.noreply.github.com'
          git add src/api/main.ts test/runtime-smoke.mjs test/mobile-homepage-css.mjs .github/workflows/home-app-shell.yml .github/scripts/home_app_shell.py .github/scripts/home_app_shell2.py .github/scripts/home_app_shell_tests.py
          git commit -m 'Turn homepage into full-screen app shell'
          git push origin HEAD:home-app-shell
