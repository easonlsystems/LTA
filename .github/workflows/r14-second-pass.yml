name: R14 second-pass patch

on:
  push:
    branches: ["audit/r14-second-pass"]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/r14-second-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused R14 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, found {count}")
              return out

          main_path = Path('src/api/main.ts')
          main = main_path.read_text()
          main = replace_once(
              main,
              "const allowedPublicHosts=publicHostAllowlist(env().PUBLIC_BASE_URL,[process.env.RAILWAY_PUBLIC_DOMAIN??'']);\nconst app=Fastify();",
              "const allowedPublicHosts=publicHostAllowlist(env().PUBLIC_BASE_URL,[process.env.RAILWAY_PUBLIC_DOMAIN??'']);\nconst redditOAuthReady=Boolean(env().REDDIT_CLIENT_ID&&env().REDDIT_CLIENT_SECRET);\nconst app=Fastify();",
              'reddit capability flag'
          )
          main = replace_once(main, '<button class=\"sim-tab\" type=\"button\" data-sim-source=\"reddit\">Reddit · paused</button>', '<button class=\"sim-tab\" type=\"button\" data-sim-source=\"reddit\">${redditOAuthReady?\'Reddit\':\'Reddit · paused\'}</button>', 'simulation reddit label')
          main = replace_once(main, '<button class=\"source-button\" type=\"button\" data-source-key=\"reddit\"><span class=\"source-glyph\">R</span><strong>Reddit · paused</strong></button>', '<button class=\"source-button\" type=\"button\" data-source-key=\"reddit\"><span class=\"source-glyph\">R</span><strong>${redditOAuthReady?\'Reddit\':\'Reddit · paused\'}</strong></button>', 'source explorer reddit label')

          old_menu = '''          <div class=\"usecase-menu\" id=\"usecase-menu\">
            <button class=\"usecase-option active\" type=\"button\" data-usecase=\"reddit\"><strong>Summarize this Reddit thread.</strong><span>Discussion → themes + disagreement</span></button>
            <button class=\"usecase-option\" type=\"button\" data-usecase=\"youtube\"><strong>What is this YouTube video arguing?</strong><span>Video → claims + structure</span></button>
            <button class=\"usecase-option\" type=\"button\" data-usecase=\"github\"><strong>Review this GitHub issue and suggest a fix.</strong><span>Issue → context + next step</span></button>
            <button class=\"usecase-option\" type=\"button\" data-usecase=\"research\"><strong>Compare this PDF with this article.</strong><span>Research → overlap + differences</span></button>
          </div>'''
          new_menu = '''          <div class=\"usecase-menu\" id=\"usecase-menu\">
            ${redditOAuthReady?`<button class=\"usecase-option active\" type=\"button\" data-usecase=\"reddit\"><strong>Summarize this Reddit thread.</strong><span>Discussion → themes + disagreement</span></button>`:`<button class=\"usecase-option\" type=\"button\" disabled aria-disabled=\"true\"><strong>Reddit · temporarily paused.</strong><span>Approved OAuth access required</span></button>`}
            <button class=\"usecase-option${redditOAuthReady?'':' active'}\" type=\"button\" data-usecase=\"youtube\"><strong>What is this YouTube video arguing?</strong><span>Video → claims + structure</span></button>
            <button class=\"usecase-option\" type=\"button\" data-usecase=\"github\"><strong>Review this GitHub issue and suggest a fix.</strong><span>Issue → context + next step</span></button>
            <button class=\"usecase-option\" type=\"button\" data-usecase=\"research\"><strong>Compare this PDF with this article.</strong><span>Research → overlap + differences</span></button>
          </div>'''
          main = replace_once(main, old_menu, new_menu, 'usecase reddit gating')

          old_initial = '<div class=\"usecase-chat\"><div class=\"usecase-user\" id=\"usecase-user\">Summarize this Reddit thread and tell me where people disagree.</div><div class=\"usecase-result\" id=\"usecase-result\"><div class=\"usecase-result-label\">Example output · representative</div><strong>The disagreement is mostly about where the failure happens.</strong><ul><li>One side blames source access.</li><li>Another side points to whether the connector was loaded and invoked.</li><li>The useful follow-up is to separate source availability from tool-selection behavior.</li></ul></div></div>'
          new_initial = '<div class=\"usecase-chat\"><div class=\"usecase-user\" id=\"usecase-user\">${redditOAuthReady?\'Summarize this Reddit thread and tell me where people disagree.\':\'What is this YouTube video arguing, and what evidence does it use?\'}</div><div class=\"usecase-result\" id=\"usecase-result\"><div class=\"usecase-result-label\">Example output · representative</div>${redditOAuthReady?`<strong>The disagreement is mostly about where the failure happens.</strong><ul><li>One side blames source access.</li><li>Another side points to whether the connector was loaded and invoked.</li><li>The useful follow-up is to separate source availability from tool-selection behavior.</li></ul>`:`<strong>The creator makes one central claim and supports it in three stages.</strong><ul><li>The opening establishes the problem.</li><li>The middle uses examples to support the thesis.</li><li>The ending narrows the claim but leaves one assumption unresolved.</li></ul>`}</div></div>'
          main = replace_once(main, old_initial, new_initial, 'usecase initial result')

          main = replace_once(main, "const homeExperienceJs=`(()=>{\n      const demos={", "const homeExperienceJs=`(()=>{\n      const redditAvailable=${redditOAuthReady?'true':'false'};\n      const demos={", 'browser reddit availability')
          old_source = "reddit:{label:'Reddit · temporarily paused',title:'Reddit now requires approved Data API access from hosted services.',question:'Link2AI will re-enable Reddit after approved OAuth access is configured.',result:'We do not bypass Reddit’s access controls. Failed or unavailable reads cost 0 units.',sim:null},"
          new_source = "reddit:redditAvailable?{label:'Reddit · public discussion',title:'Bring the public discussion into context.',question:'“Where do people in this Reddit thread disagree?”',result:'Approved Reddit Data API access is configured for this deployment.',sim:'reddit'}:{label:'Reddit · temporarily paused',title:'Reddit now requires approved Data API access from hosted services.',question:'Link2AI will re-enable Reddit after approved OAuth access is configured.',result:'We do not bypass Reddit’s access controls. Failed or unavailable reads cost 0 units.',sim:null},"
          main = replace_once(main, old_source, new_source, 'source explorer runtime reddit gate')

          anchor = "      const renderAnswer=(el,lead,points)=>{el.innerHTML='<span class=\"sim-example-tag\">Example output · representative</span><strong>'+lead+'</strong><ul>'+points.map(x=>'<li>'+x+'</li>').join('')+'</ul>';};\n      const runDemo=(markInteraction=false)=>{if(markInteraction)state.interacted=true;resetDemo();"
          replacement = "      const renderAnswer=(el,lead,points)=>{el.innerHTML='<span class=\"sim-example-tag\">Example output · representative</span><strong>'+lead+'</strong><ul>'+points.map(x=>'<li>'+x+'</li>').join('')+'</ul>';};\n      const renderRedditPaused=()=>{q('#sim-left-state').textContent='Ready';q('#sim-left-state').className='sim-state';q('#sim-right-state').textContent='Temporarily paused';q('#sim-right-state').className='sim-state failed';qa('#sim-left-thinking .sim-line,#sim-right-thinking .sim-line').forEach(el=>el.classList.remove('live'));q('#sim-tool').classList.add('show');q('#sim-tool').innerHTML='Reddit · Approved OAuth access required <i>0 units</i>';q('#sim-right-answer').innerHTML='<span class=\"sim-example-tag\">Current availability</span>Reddit reads are paused on this deployment rather than bypassing Reddit’s hosted-service access controls.';q('#sim-right-answer').classList.add('show');q('#sim-conclusion').classList.remove('show');q('#sim-conclusion').hidden=true;};\n      const runDemo=(markInteraction=false)=>{if(markInteraction)state.interacted=true;resetDemo();if(state.source==='reddit'&&!redditAvailable){renderRedditPaused();return;}"
          main = replace_once(main, anchor, replacement, 'simulation hard gate')

          listener_pattern = r"      qa\('\.sim-tab'\)\.forEach\(btn=>btn\.addEventListener\('click',\(\)=>\{state\.interacted=true;renderDemoSource\(btn\.dataset\.simSource\);.*?\}\)\);q\('#sim-run'\)\.addEventListener\('click',\(\)=>runDemo\(true\)\);q\('#sim-reset'\)\.addEventListener\('click',\(\)=>resetDemo\(true\)\);"
          listener_replacement = "      qa('.sim-tab').forEach(btn=>btn.addEventListener('click',()=>{state.interacted=true;renderDemoSource(btn.dataset.simSource);if(btn.dataset.simSource==='reddit'&&!redditAvailable){renderRedditPaused();return;}runDemo(false);}));q('#sim-run').addEventListener('click',()=>runDemo(true));q('#sim-reset').addEventListener('click',()=>resetDemo(true));"
          main = regex_once(main, listener_pattern, listener_replacement, 'simulation tab listener')
          main = replace_once(main, "qa('.usecase-option').forEach(btn=>btn.addEventListener('click',()=>showUsecase(btn.dataset.usecase)));", "qa('.usecase-option').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.usecase==='reddit'&&!redditAvailable)return;showUsecase(btn.dataset.usecase);}));", 'usecase browser guard')
          if main.count('20260917-r13') != 1:
              raise SystemExit(f"home asset version: expected one r13 marker, found {main.count('20260917-r13')}")
          main = main.replace('20260917-r13','20260917-r14')
          main_path.write_text(main)

          env_path = Path('.env.example')
          env_text = env_path.read_text()
          env_text = replace_once(env_text, '# Media / extraction\n', '# Reddit Data API (optional; Reddit stays unavailable until both credentials are configured)\nREDDIT_CLIENT_ID=\nREDDIT_CLIENT_SECRET=\nREDDIT_USER_AGENT=Link2AI/1.3 public-link-reader\n\n# Media / extraction\n', 'env reddit contract')
          env_path.write_text(env_text)

          readiness_path = Path('src/config/readiness.ts')
          readiness = readiness_path.read_text()
          readiness = replace_once(readiness, "  if(role==='api'){", "  if(Boolean(e.REDDIT_CLIENT_ID)!==Boolean(e.REDDIT_CLIENT_SECRET))issues.push('REDDIT_CLIENT_ID and REDDIT_CLIENT_SECRET must be configured together');\n  if(role==='api'){", 'reddit readiness pair')
          readiness_path.write_text(readiness)

          smoke_path = Path('test/runtime-smoke.mjs')
          smoke = smoke_path.read_text()
          if smoke.count('20260917-r13') != 2:
              raise SystemExit(f"runtime asset version: expected two r13 markers, found {smoke.count('20260917-r13')}")
          smoke = smoke.replace('20260917-r13','20260917-r14')
          home_assert = "assert.match(body,/Built by Eason Systems/);assert.doesNotMatch(body,/V2 · public links → readable source context/);"
          home_assert_new = "assert.match(body,/Built by Eason Systems/);assert.match(body,/Reddit · paused/);assert.match(body,/Reddit · temporarily paused\./);assert.doesNotMatch(body,/Summarize this Reddit thread\./);assert.doesNotMatch(body,/V2 · public links → readable source context/);"
          smoke = replace_once(smoke, home_assert, home_assert_new, 'homepage paused claim assertions')
          reset_anchor = "  assert.equal(ids['sim-right-state'].textContent,'Ready','Reset must cancel queued autoplay and keep right Ready');\n  // A real Run should survive the previous Reset and complete every stage."
          reset_insert = "  assert.equal(ids['sim-right-state'].textContent,'Ready','Reset must cancel queued autoplay and keep right Ready');\n  // Reddit is intentionally unavailable without OAuth credentials. Selecting it and then pressing Run must never turn it into a fake success.\n  simTabs[0].listeners.click();\n  assert.equal(ids['sim-right-state'].textContent,'Temporarily paused','Reddit tab must show paused when credentials are absent');\n  assert.match(ids['sim-tool'].innerHTML,/Approved OAuth access required/);\n  ids['sim-run'].listeners.click();\n  runAllTimers();\n  assert.equal(ids['sim-right-state'].textContent,'Temporarily paused','Run must not bypass the Reddit availability gate');\n  assert.doesNotMatch(ids['sim-tool'].innerHTML,/Source loaded/);\n  assert.match(ids['sim-right-answer'].innerHTML,/paused on this deployment/);\n  assert.equal(ids['sim-conclusion'].hidden,true,'paused Reddit must not show the success conclusion');\n  simTabs[1].listeners.click();\n  ids['sim-reset'].listeners.click();\n  // A real Run should survive the previous Reset and complete every stage."
          smoke = replace_once(smoke, reset_anchor, reset_insert, 'reddit regression test')
          smoke_path.write_text(smoke)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test
      - name: Commit tested patch
        shell: bash
        run: |
          git rm .github/workflows/r14-second-pass.yml
          git config user.name "Link2AI Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/api/main.ts src/config/readiness.ts test/runtime-smoke.mjs .env.example
          git commit -m "fix: gate Reddit capability claims"
          git push origin HEAD:audit/r14-second-pass
