name: R10 auto-use and simulation

on:
  push:
    branches:
      - r10-claude-auto-use-20260917

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply R10 patch
        run: python3 scripts/r10_auto_use_and_sim.py
      - name: Install
        run: npm ci
      - name: Full regression
        run: npm test
      - name: Commit validated R10
        run: |
          git config user.name "easonsystems"
          git config user.email "easonlsy1019@gmail.com"
          git rm .github/workflows/r10-auto-use-sim.yml scripts/r10_auto_use_and_sim.py
          git add src/api/main.ts src/mcp/server.ts test/mcp-smoke.mjs test/runtime-smoke.mjs
          git diff --cached --check
          git commit -m "Fix Claude auto-use and homepage simulation runtime"
          git push origin HEAD:r10-claude-auto-use-20260917
