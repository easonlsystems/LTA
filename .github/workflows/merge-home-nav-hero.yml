name: Merge home nav into hero
on:
  push:
    branches: [merge-home-nav-hero]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: merge-home-nav-hero
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extend hero behind homepage navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old,new,1)

          p=Path('src/api/main.ts')
          s=p.read_text()
          s=replace_once(
              s,
              '.experience-hero{position:relative;padding:76px 0 70px;background:',
              '.experience-hero{position:relative;margin-top:-78px;padding:154px 0 70px;background:',
              'desktop hero/nav integration'
          )
          s=replace_once(
              s,
              '  .experience-hero{padding:38px 0 42px}',
              '  .experience-hero{margin-top:-68px;padding:106px 0 42px}',
              'mobile hero/nav integration'
          )
          p.write_text(s)

          p=Path('test/mobile-homepage-css.mjs')
          t=p.read_text()
          marker="assert.match(source,/\\.experience-hero h1\\{margin:14px 0 14px;font-size:clamp\\(37px,10\\.7vw,44px\\)/);"
          replacement=marker+"\nassert.match(source,/\\.experience-hero\\{position:relative;margin-top:-78px;padding:154px 0 70px/);\nassert.match(source,/\\.experience-hero\\{margin-top:-68px;padding:106px 0 42px\\}/);"
          t=replace_once(t,marker,replacement,'homepage nav/hero regression assertions')
          p.write_text(t)
          PY
      - name: Verify integrated hero contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('src/api/main.ts','utf8');
          if(!s.includes('.experience-hero{position:relative;margin-top:-78px;padding:154px 0 70px')) throw new Error('desktop hero does not extend behind nav');
          if(!s.includes('.experience-hero{margin-top:-68px;padding:106px 0 42px}')) throw new Error('mobile hero does not extend behind nav');
          if(!s.includes('.home-nav{background:transparent;border-bottom-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}')) throw new Error('transparent homepage nav missing');
          NODE
      - run: npm ci
      - run: npm test
      - name: Commit validated update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Link2AI UI Polish"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/merge-home-nav-hero.yml
          git add src/api/main.ts test/mobile-homepage-css.mjs
          git commit -m "Integrate homepage navigation with hero"
          git push origin HEAD:merge-home-nav-hero
