name: Unified regional fallback and founding offer
on:
  push:
    branches: [unified-regional-founding-offer]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply unified update
        run: python .github/scripts/unified_patch.py
      - name: Validate
        run: npm ci && npm test
      - name: Commit validated update
        shell: bash
        run: |
          rm .github/workflows/unified-regional-founding-offer.yml
          rm .github/scripts/unified_patch.py
          git config user.name "Link2AI Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src sql test railway.worker.json .github/workflows/unified-regional-founding-offer.yml .github/scripts/unified_patch.py
          git commit -m "Add regional YouTube fallback and founding offer"
          git push origin HEAD:unified-regional-founding-offer
