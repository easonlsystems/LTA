name: Publish Python client

on:
  push:
    tags:
      - 'python-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          with open("clients/python/pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          EXPECTED_TAG="python-v${PACKAGE_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}. Expected ${EXPECTED_TAG}."
            exit 1
          fi
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build clients/python --outdir dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
