name: Final UI inspection

on:
  push:
    branches: [ui-full-canvas]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-full-canvas
      - name: Inspect target markup
        run: |
          grep -Rni -C 4 -E "Pick based on processing|Choose Basic|Choose Pro|Something got in the way|support-grid|pricing" src test | head -n 500 || true
