name: R6 scope MCP origin validation

on:
  push:
    branches: ["r6-scope-mcp-origin-20260916"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add R6 scoped MCP origin patcher'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r6-scope-mcp-origin-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped MCP origin fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/api/main.ts')
          s=p.read_text()
          a="import { createMcpFastifyApp } from '@modelcontextprotocol/fastify';\nimport type { FastifyReply, FastifyRequest } from 'fastify';"
          b="import { hostHeaderValidation } from '@modelcontextprotocol/fastify';\nimport Fastify, { type FastifyReply, type FastifyRequest } from 'fastify';"
          if a not in s: raise SystemExit('Fastify import anchor not found')
          s=s.replace(a,b,1)
          a="import { createMcpHandler } from '@modelcontextprotocol/server';"
          b="import { createMcpHandler, validateOriginHeader } from '@modelcontextprotocol/server';"
          if a not in s: raise SystemExit('MCP server import anchor not found')
          s=s.replace(a,b,1)
          a="const app=createMcpFastifyApp({host:'0.0.0.0',allowedHosts:allowedPublicHosts,allowedOrigins:allowedPublicHosts});"
          b="const app=Fastify();\napp.addHook('onRequest',hostHeaderValidation(allowedPublicHosts));"
          if a not in s: raise SystemExit('MCP Fastify app anchor not found')
          s=s.replace(a,b,1)
          a="""app.all('/mcp',async(request,reply)=>{\n  const auth=await authInfoFromBearer(request.headers.authorization);"""
          b="""app.all('/mcp',async(request,reply)=>{\n  const originHeader=Array.isArray(request.headers.origin)?request.headers.origin[0]:request.headers.origin;\n  const originCheck=validateOriginHeader(originHeader,allowedPublicHosts);\n  if(!originCheck.ok){\n    return reply.code(403).send({jsonrpc:'2.0',error:{code:-32000,message:originCheck.message},id:null});\n  }\n  const auth=await authInfoFromBearer(request.headers.authorization);"""
          if a not in s: raise SystemExit('MCP route anchor not found')
          s=s.replace(a,b,1)
          p.write_text(s)

          p=Path('src/config/publicUrl.ts')
          s=p.read_text()
          a="""  if(candidateRaw.toLowerCase()==='null')return false;\n  if(!candidateRaw){\n    // Referrer-Policy may intentionally suppress Referer. Modern browsers still expose\n    // Fetch Metadata; with the per-session CSRF token this is a safe same-origin fallback.\n    return firstHeader(headers['sec-fetch-site']).trim().toLowerCase()==='same-origin';\n  }"""
          b="""  if(candidateRaw.toLowerCase()==='null'){\n    // Some legitimate browser surfaces submit an opaque Origin while still exposing\n    // Fetch Metadata. Accept it only when the browser itself classifies the request as\n    // same-origin; cross-site opaque origins remain rejected. CSRF is checked separately.\n    return firstHeader(headers['sec-fetch-site']).trim().toLowerCase()==='same-origin';\n  }\n  if(!candidateRaw){\n    // Referrer-Policy may intentionally suppress Referer. Modern browsers still expose\n    // Fetch Metadata; with the per-session CSRF token this is a safe same-origin fallback.\n    return firstHeader(headers['sec-fetch-site']).trim().toLowerCase()==='same-origin';\n  }"""
          if a not in s: raise SystemExit('browserSameOriginOk anchor not found')
          s=s.replace(a,b,1)
          p.write_text(s)

          p=Path('test/security.mjs')
          s=p.read_text()
          a="assert.equal(publicUrl.browserSameOriginOk({host:'live.example',origin:'null'},'https://configured.example',true),false,'opaque null origin must be rejected');"
          b="assert.equal(publicUrl.browserSameOriginOk({host:'live.example',origin:'null','sec-fetch-site':'same-origin'},'https://configured.example',true),true,'opaque origin from a browser-classified same-origin request may proceed to CSRF validation');\nassert.equal(publicUrl.browserSameOriginOk({host:'live.example',origin:'null','sec-fetch-site':'cross-site'},'https://configured.example',true),false,'cross-site opaque origin must be rejected');"
          if a not in s: raise SystemExit('security opaque-origin assertion anchor not found')
          s=s.replace(a,b,1)
          p.write_text(s)

          p=Path('test/runtime-smoke.mjs')
          s=p.read_text()
          a="""  const unauthorized=await fetch(`http://127.0.0.1:${port}/mcp`,{\n    method:'POST',headers:{host:'link2ai.example','content-type':'application/json'},body:'{}'\n  });\n  assert.equal(unauthorized.status,401);\n  assert.match(unauthorized.headers.get('www-authenticate')??'',/oauth-protected-resource\\/mcp/);"""
          b="""  const mcpOpaqueOrigin=await rawPost('/mcp',{\n    host:'link2ai.example',origin:'null','sec-fetch-site':'same-origin','content-type':'application/json'\n  },'{}');\n  assert.equal(mcpOpaqueOrigin.status,403,'MCP must keep rejecting opaque browser origins even when site metadata says same-origin');\n\n  const unauthorized=await fetch(`http://127.0.0.1:${port}/mcp`,{\n    method:'POST',headers:{host:'link2ai.example','content-type':'application/json'},body:'{}'\n  });\n  assert.equal(unauthorized.status,401);\n  assert.match(unauthorized.headers.get('www-authenticate')??'',/oauth-protected-resource\\/mcp/);"""
          if a not in s: raise SystemExit('runtime MCP anchor not found')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Install and run full regression
        run: |
          npm ci
          npm test
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/r6-scope-mcp-origin.yml
          git config user.name "easonsystems"
          git config user.email "easonlsy1019@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Scope MCP origin validation to MCP route"
          git push origin HEAD:r6-scope-mcp-origin-20260916
