name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Build production runtime image
        run: docker build -t link2ai-runtime-ci .

      - name: Smoke native runtime dependencies
        run: |
          docker run --rm --entrypoint sh link2ai-runtime-ci -c '
            set -eu
            yt-dlp --version
            gallery-dl --version
            ffmpeg -version >/dev/null
            ffprobe -version >/dev/null
            pdftotext -v
            tesseract --version >/dev/null
            for lang in eng chi_tra chi_sim jpn kor; do tesseract --list-langs | grep -qx "$lang"; done
            python3 -c "import curl_cffi, youtube_transcript_api"
          '
