name: R9b experience polish

on:
  push:
    branches:
      - r9b-experience-polish-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply polish
        run: python3 scripts/r9b_polish.py
      - run: npm ci
      - name: Full regression
        run: npm test
      - name: Commit validated polish
        run: |
          git config user.name "easonsystems"
          git config user.email "easonlsy1019@gmail.com"
          git add src/api/main.ts
          git diff --cached --quiet && exit 0
          git commit -m "Polish full-bleed homepage experience"
          git push origin HEAD:r9b-experience-polish-20260916
