name: R9 interactive homepage

on:
  push:
    branches:
      - r9-interactive-home-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply R9 homepage patch
        run: python3 scripts/r9_interactive_home.py
      - name: Install dependencies
        run: npm ci
      - name: Run full regression
        run: npm test
      - name: Commit validated R9 homepage
        run: |
          git config user.name "easonsystems"
          git config user.email "easonlsy1019@gmail.com"
          git add src/api/main.ts test/runtime-smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Build interactive product-led homepage"
          git push origin HEAD:r9-interactive-home-20260916
