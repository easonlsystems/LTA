name: YouTube transcript fallback probe
on:
  push:
    branches: [yt-longform-home-sources]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public transcript endpoint library
        shell: bash
        run: |
          python -m pip install -q youtube-transcript-api
          python - <<'PY'
from youtube_transcript_api import YouTubeTranscriptApi
for vid in ['jJiw4CdAanw','aqz-KE-bpKQ','dQw4w9WgXcQ']:
    print('===',vid,'===')
    try:
        api=YouTubeTranscriptApi()
        tracks=api.list(vid)
        print('tracks',[(t.language_code,t.is_generated) for t in tracks][:8])
        picked=None
        for t in tracks:
            picked=t; break
        if picked:
            rows=picked.fetch()
            print('rows',len(rows),'sample',[(r.text,r.start,r.duration) for r in rows[:3]])
    except Exception as e:
        print(type(e).__name__,str(e)[:1200])
PY
