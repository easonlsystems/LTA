name: YouTube transcript fallback probe
on:
  push:
    branches: [yt-longform-home-sources]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public transcript endpoint library
        run: |
          python -m pip install -q youtube-transcript-api
          python scripts/probe_youtube_transcript.py
