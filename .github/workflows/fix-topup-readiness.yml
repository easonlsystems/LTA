name: Fix top-up readiness
on:
  push:
    branches: [topup-backup-hardening-20260917]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topup-backup-hardening-20260917
      - name: Patch readiness gating
        shell: python
        run: |
          from pathlib import Path
          def rep(path,old,new):
            p=Path(path); s=p.read_text()
            if old not in s: raise SystemExit(f'anchor missing: {path}')
            p.write_text(s.replace(old,new,1))
          rep('src/billing/lemon.ts',"export async function canPurchaseTopup(userId:string):Promise<boolean>{\n  const r=await pool.query(`SELECT 1 FROM subscriptions WHERE user_id=$1 AND provider='lemonsqueezy' AND status IN ('active','trialing') LIMIT 1`,[userId]);\n  return Boolean(r.rowCount);\n}","export function topupConfigured():boolean{\n  return Boolean(env().LEMONSQUEEZY_API_KEY&&env().LEMONSQUEEZY_STORE_ID&&env().LEMONSQUEEZY_TOPUP_500_VARIANT_ID&&env().LEMONSQUEEZY_TOPUP_1500_VARIANT_ID);\n}\n\nexport async function canPurchaseTopup(userId:string):Promise<boolean>{\n  if(!topupConfigured())return false;\n  const r=await pool.query(`SELECT 1 FROM subscriptions WHERE user_id=$1 AND provider='lemonsqueezy' AND status IN ('active','trialing') LIMIT 1`,[userId]);\n  return Boolean(r.rowCount);\n}")
          rep('src/billing/routes.ts',"import { canPurchaseTopup, createBillingPortalSession, createCheckoutSession, createTopupCheckoutSession, processLemonEvent, verifyLemonSignature, type PaidPlan, type TopupPack } from './lemon.js';","import { canPurchaseTopup, createBillingPortalSession, createCheckoutSession, createTopupCheckoutSession, processLemonEvent, topupConfigured, verifyLemonSignature, type PaidPlan, type TopupPack } from './lemon.js';")
          rep('src/billing/routes.ts',"    const topupSection=(cookieHeader:string|undefined)=>`<section class=\"card topup-card\">","    const topupInfo=`<section class=\"card topup-card\"><h2>Need more units?</h2><p class=\"muted\">Active Basic and Pro subscribers can add extra units anytime.</p><div class=\"topup-grid\"><div class=\"topup-option\"><strong>+500 units</strong><span>US$3.99 · one-time</span></div><div class=\"topup-option\"><strong>+1,500 units</strong><span>US$8.99 · one-time</span></div></div><p class=\"fine\">Purchased units never expire. If you cancel, the remaining paid balance stays on the account and becomes available again when you resubscribe. <strong>No automatic overage charges.</strong></p></section>`;\n    const topupSection=(cookieHeader:string|undefined)=>`<section class=\"card topup-card\">")
          rep('src/billing/routes.ts',"${plans('public')}<p class=\"plan-note\">Supported public links only.","${plans('public')}${topupConfigured()?topupInfo:''}<p class=\"plan-note\">Supported public links only.")
          p=Path('test/topup-backup-schema.mjs'); s=p.read_text(); s=s.replace("assert.match(lemon,/purpose:'topup'/);","assert.match(lemon,/purpose:'topup'/);\nassert.match(lemon,/function topupConfigured/,'top-up UI must stay hidden until both paid variants are configured');")
          p.write_text(s)
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/billing/lemon.ts src/billing/routes.ts test/topup-backup-schema.mjs
          git diff --cached --check
          git commit -m 'Hide top-ups until billing variants are ready'
          git push origin HEAD:topup-backup-hardening-20260917
