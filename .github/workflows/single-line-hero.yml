name: Single line hero

on:
  push:
    branches: [single-line-hero]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: single-line-hero
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Keep desktop hero headline on one line
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/api/main.ts')
          s=p.read_text()
          old='<h1>Paste a link.<br><span>Claude can read it.</span></h1>'
          new='<h1>Paste a link. <span>Claude can read it.</span></h1>'
          if old not in s:
              raise SystemExit('hero markup target not found')
          s=s.replace(old,new,1)
          old_css='.experience-copy{text-align:left;max-width:900px;margin:0 0 28px}.experience-kicker'
          new_css='.experience-copy{text-align:left;max-width:1180px;margin:0 0 28px}.experience-kicker'
          if old_css not in s:
              raise SystemExit('experience-copy target not found')
          s=s.replace(old_css,new_css,1)
          old_h1='.experience-hero h1{margin:20px 0 18px;font-size:clamp(50px,7.4vw,92px);line-height:.91;letter-spacing:-.072em;max-width:920px}'
          new_h1='.experience-hero h1{margin:20px 0 18px;font-size:clamp(52px,5.4vw,78px);line-height:.94;letter-spacing:-.072em;max-width:none;white-space:nowrap}'
          if old_h1 not in s:
              raise SystemExit('desktop h1 target not found')
          s=s.replace(old_h1,new_h1,1)
          mobile='@media(max-width:650px){.experience-home .home-inner'
          if mobile not in s:
              raise SystemExit('mobile breakpoint target not found')
          s=s.replace(mobile,'@media(max-width:650px){.experience-hero h1{white-space:normal}.experience-home .home-inner',1)
          p.write_text(s)
          PY
      - name: Verify hero contract
        run: |
          grep -F '<h1>Paste a link. <span>Claude can read it.</span></h1>' src/api/main.ts
          grep -F 'white-space:nowrap' src/api/main.ts
          grep -F '.experience-hero h1{white-space:normal}' src/api/main.ts
      - run: npm ci
      - run: npm test
      - name: Commit validated update and remove one-time workflow
        run: |
          rm .github/workflows/single-line-hero.yml
          git config user.name 'Link2AI UI Polish'
          git config user.email 'actions@users.noreply.github.com'
          git add src/api/main.ts .github/workflows/single-line-hero.yml
          git commit -m 'Keep desktop hero headline on one line'
          git push origin HEAD:single-line-hero
