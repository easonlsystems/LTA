name: Apply top-up scope fix
on:
  push:
    branches: [topup-backup-hardening-20260917]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topup-backup-hardening-20260917
      - name: Apply scope fix
        run: python .tmp/fix_topup_scope.py
      - name: Commit scope fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/billing/routes.ts
          git diff --cached --check
          git commit -m 'Share top-up UI helper across billing routes'
          git push origin HEAD:topup-backup-hardening-20260917
