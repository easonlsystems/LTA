name: Apply V2 YouTube and homepage source patch
on:
  push:
    branches: [yt-longform-home-sources]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply coherent source patch
        run: node scripts/apply_v2_source_patch.mjs
      - name: Validate Python fallback helper
        run: |
          python3 -m py_compile assets/youtube_transcript.py
          python3 -m pip install -q youtube-transcript-api==1.2.4
          python3 -c "from youtube_transcript_api import YouTubeTranscriptApi; print('youtube-transcript-api import OK')"
      - name: Install and test
        run: |
          npm ci
          npm test
          git diff --check
      - name: Remove temporary patch/probe files
        run: |
          rm -f scripts/apply_v2_source_patch.mjs
          rm -f scripts/probe_youtube_transcript.py
          rm -f .github/workflows/yt-transcript-fallback-probe.yml
          rm -f .github/workflows/apply-v2-source-patch.yml
      - name: Commit validated changes
        run: |
          git config user.name 'Link2AI Source Hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Improve YouTube fallback and expand homepage source demos'
          git push origin HEAD:yt-longform-home-sources
