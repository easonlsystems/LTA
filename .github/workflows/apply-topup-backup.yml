          replace_once('src/billing/routes.ts',
            "    return reply.type('text/html').send(page(`${topbar(user.email)}<section class=\"hero\"><span class=\"eyebrow\">Upgrade</span><div class=\"pricing-intro\"><h1>Pick based on processing capacity and concurrency — not content type or video length.</h1><p class=\"muted\">Basic and Pro read the same supported content types. Pro mainly gives you more units each billing cycle and higher concurrency. Unused paid units roll over while your paid subscription stays active.</p></div>${plans('checkout')}<p class=\"plan-note\">Only successfully processed content consumes usage. Unsupported, inaccessible, login-required, empty or failed reads use 0 processing units. You can manage or cancel a paid subscription from your account.</p></section>`,`${esc(env().PUBLIC_BRAND_NAME)} Pricing`));",
