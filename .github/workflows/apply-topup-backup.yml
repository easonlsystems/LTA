name: Apply top-up and backup implementation
on:
  push:
    branches: [topup-backup-hardening-20260917]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topup-backup-hardening-20260917
      - name: Apply implementation
        run: python .tmp/apply_topup_backup.py
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config/env.ts src/billing/lemon.ts src/billing/routes.ts sql/004_topup_ledger.sql .github/workflows/offsite-db-backup.yml docs/BACKUP_RUNBOOK.md test/topup-backup-schema.mjs package.json
          git diff --cached --check
          git commit -m 'Add subscriber top-ups and immutable offsite backups'
          git push origin HEAD:topup-backup-hardening-20260917
