name: Finalize chat simulation

on:
  push:
    branches: ["chat-simulation-polish"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Final cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/api/main.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<span class="experience-kicker">Interactive demo · Claude-first beta</span>','<span class="experience-kicker">Interactive comparison · Claude-first</span>',1)
          s=s.replace('  .sim-question{margin:0 14px 12px;padding:12px 13px;border-radius:14px}\n  .sim-question p{font-size:13px}\n','',1)
          p.write_text(s,encoding='utf-8')
          t=Path('test/runtime-smoke.mjs')
          x=t.read_text(encoding='utf-8').replace('assert.match(body,/Interactive demo · Claude-first beta/);','assert.match(body,/Interactive comparison · Claude-first/);',1)
          t.write_text(x,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm test
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Link2AI UI Polish"
          git config user.email "actions@users.noreply.github.com"
          git add src/api/main.ts test/runtime-smoke.mjs
          git diff --cached --check
          git commit -m "Refine chat comparison copy"
          git push origin HEAD:chat-simulation-polish
