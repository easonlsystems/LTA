name: Python client live black-box

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require reviewer credentials
        env:
          LINK2AI_CERT_EMAIL: ${{ secrets.LINK2AI_CERT_EMAIL }}
          LINK2AI_CERT_PASSWORD: ${{ secrets.LINK2AI_CERT_PASSWORD }}
        run: |
          if [ -z "$LINK2AI_CERT_EMAIL" ] || [ -z "$LINK2AI_CERT_PASSWORD" ]; then
            echo "Reviewer credentials are required; live Python black-box verification did not run."
            exit 1
          fi
      - name: Install Python client
        run: python -m pip install ./clients/python
      - name: Run real integration shapes
        env:
          LINK2AI_PRODUCTION_URL: https://api-production-0383e.up.railway.app
          LINK2AI_CERT_EMAIL: ${{ secrets.LINK2AI_CERT_EMAIL }}
          LINK2AI_CERT_PASSWORD: ${{ secrets.LINK2AI_CERT_PASSWORD }}
        run: python clients/python/tests/live_black_box.py
