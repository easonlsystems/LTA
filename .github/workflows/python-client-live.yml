name: Python client live black-box

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require live API key
        env:
          LTA_API_KEY: ${{ secrets.LTA_PYTHON_CERT_API_KEY }}
        run: |
          if [ -z "$LTA_API_KEY" ]; then
            echo "LTA_PYTHON_CERT_API_KEY is required; live black-box verification did not run."
            exit 1
          fi
      - name: Install Python client
        run: python -m pip install ./clients/python
      - name: Run real integration shapes
        env:
          LTA_API_KEY: ${{ secrets.LTA_PYTHON_CERT_API_KEY }}
          LTA_BASE_URL: https://api-production-0383e.up.railway.app
        run: python clients/python/tests/live_black_box.py
