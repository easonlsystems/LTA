name: Explicit chat comparison fix
on:
  push:
    branches: [explicit-chat-comparison]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explicit-chat-comparison
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make comparison click-driven
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old,new,1)

          p=Path('src/api/main.ts')
          s=p.read_text()
          s=replace_once(s,'<button class="sim-run" id="sim-run" type="button">Play conversations →</button>','<button class="sim-run" id="sim-run" type="button">See the difference →</button>','run button copy')
          s=replace_once(s,'<div class="sim-thinking" id="sim-left-thinking"><div class="sim-line"></div><div class="sim-line"></div><div class="sim-line"></div></div>','','left gray skeleton')
          s=replace_once(s,'<div class="sim-thinking" id="sim-right-thinking"><div class="sim-line"></div><div class="sim-line"></div><div class="sim-line"></div></div>','','right gray skeleton')
          s=replace_once(s,'qa(\'.sim-tab\').forEach(btn=>btn.addEventListener(\'click\',()=>{state.interacted=true;renderDemoSource(btn.dataset.simSource);if(btn.dataset.simSource===\'reddit\'&&!redditAvailable){renderRedditPaused();return;}runDemo(false);}));q(\'#sim-run\').addEventListener(\'click\',()=>runDemo(true));q(\'#sim-reset\').addEventListener(\'click\',()=>resetDemo(true));',"qa('.sim-tab').forEach(btn=>btn.addEventListener('click',()=>{state.interacted=true;renderDemoSource(btn.dataset.simSource);if(btn.dataset.simSource==='reddit'&&!redditAvailable)renderRedditPaused();}));q('#sim-run').addEventListener('click',()=>runDemo(true));q('#sim-reset').addEventListener('click',()=>resetDemo(true));",'source tabs must not autoplay')
          s=replace_once(s,"qa('.source-button').forEach(btn=>btn.addEventListener('click',()=>{state.interacted=true;showSource(btn.dataset.sourceKey);}));q('#source-open-sim').addEventListener('click',(e)=>{state.interacted=true;const key=e.currentTarget.dataset.sim;if(!key)return;renderDemoSource(key);document.getElementById('simulation').scrollIntoView({behavior:'smooth'});setTimer(()=>runDemo(false),420,state.runId);});","qa('.source-button').forEach(btn=>btn.addEventListener('click',()=>{state.interacted=true;showSource(btn.dataset.sourceKey);}));q('#source-open-sim').addEventListener('click',(e)=>{state.interacted=true;const key=e.currentTarget.dataset.sim;if(!key)return;renderDemoSource(key);document.getElementById('simulation').scrollIntoView({behavior:'smooth'});});",'source explorer must not autoplay')
          s=replace_once(s,"      setTimer(()=>{if(!state.interacted)runDemo(false);},650,state.runId);","      resetDemo();",'remove homepage autoplay')
          s=s.replace('/home.js?v=20260917-chat1','/home.js?v=20260917-chat2')
          p.write_text(s)

          p=Path('test/runtime-smoke.mjs')
          t=p.read_text()
          t=replace_once(t,'assert.match(body,/Play conversations/);','assert.match(body,/See the difference/);','homepage CTA assertion')
          t=t.replace('20260917-chat1','20260917-chat2')
          t=replace_once(t,'assert.doesNotMatch(body,/Same user question/);','assert.doesNotMatch(body,/Same user question/);assert.doesNotMatch(body,/class="sim-thinking"/);','gray skeleton markup assertion')
          old="""  // Autoplay is queued, not magically completed. User Reset must cancel it.\n  assert.equal(ids['sim-left-state'].textContent,'','simulation should not jump ahead before timers run');\n  ids['sim-reset'].listeners.click();\n  runAllTimers();\n  assert.equal(ids['sim-left-state'].textContent,'Ready','Reset must cancel queued autoplay and keep left Ready');\n  assert.equal(ids['sim-right-state'].textContent,'Ready','Reset must cancel queued autoplay and keep right Ready');"""
          new="""  // The comparison must stay idle until the visitor explicitly presses the button.\n  assert.equal(ids['sim-left-state'].textContent,'Ready','simulation should initialize left side as Ready');\n  assert.equal(ids['sim-right-state'].textContent,'Ready','simulation should initialize right side as Ready');\n  assert.equal(timers.size,0,'simulation must not autoplay');\n  runAllTimers();\n  assert.equal(ids['sim-left-state'].textContent,'Ready','idle comparison must stay Ready');\n  assert.equal(ids['sim-right-state'].textContent,'Ready','idle comparison must stay Ready');"""
          t=replace_once(t,old,new,'no-autoplay test block')
          old="""  simTabs[1].listeners.click();\n  ids['sim-reset'].listeners.click();\n  // A real Run should survive the previous Reset and complete every stage.\n  ids['sim-run'].listeners.click();"""
          new="""  simTabs[1].listeners.click();\n  assert.equal(ids['sim-left-state'].textContent,'Ready','selecting a supported source must not start the comparison');\n  assert.equal(ids['sim-right-state'].textContent,'Ready','selecting a supported source must keep the comparison idle');\n  assert.equal(timers.size,0,'source tabs must not enqueue an automatic run');\n  // A real Run starts only after the visitor explicitly presses the comparison button.\n  ids['sim-run'].listeners.click();"""
          t=replace_once(t,old,new,'tab explicit-play test block')
          old="""  simTabs[2].listeners.click();\n  runAllTimers();\n  assert.match(ids['sim-url'].textContent,/github\\.com/,'source tabs must switch simulation content');\n  assert.equal(ids['sim-right-state'].textContent,'Source loaded','new source run must complete without stale timers');\n  ids['sim-reset'].listeners.click();"""
          new="""  simTabs[2].listeners.click();\n  runAllTimers();\n  assert.match(ids['sim-url'].textContent,/github\\.com/,'source tabs must switch simulation content');\n  assert.equal(ids['sim-left-state'].textContent,'Ready','switching source must cancel the old run and return left to Ready');\n  assert.equal(ids['sim-right-state'].textContent,'Ready','switching source must not autoplay the new source');\n  assert.equal(timers.size,0,'switching source must leave no stale or automatic timers');\n  ids['sim-run'].listeners.click();\n  runAllTimers();\n  assert.equal(ids['sim-right-state'].textContent,'Source loaded','explicit Run must complete the newly selected source');\n  ids['sim-reset'].listeners.click();"""
          t=replace_once(t,old,new,'switch-source explicit-play test block')
          p.write_text(t)
          PY
      - name: Verify explicit interaction contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('src/api/main.ts','utf8');
          if(s.includes('class="sim-thinking"')) throw new Error('gray skeleton markup still present');
          if(s.includes('if(!state.interacted)runDemo(false)')) throw new Error('homepage autoplay still present');
          if(s.includes("setTimer(()=>runDemo(false),420,state.runId)")) throw new Error('source explorer autoplay still present');
          if(!s.includes('See the difference →')) throw new Error('explicit comparison CTA missing');
          NODE
      - run: npm ci
      - run: npm test
      - name: Commit validated update and remove one-time workflows
        shell: bash
        run: |
          git config user.name "Link2AI UI Polish"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/explicit-chat-comparison.yml .github/workflows/explicit-chat-comparison-fix.yml
          git add src/api/main.ts test/runtime-smoke.mjs
          git commit -m "Make homepage comparison explicitly interactive"
          git push origin HEAD:explicit-chat-comparison
