name: Full canvas UI

on:
  push:
    branches:
      - ui-full-canvas

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-full-canvas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply full-canvas layout
        run: python .github/scripts/ui_full_canvas.py
      - name: Verify visual contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/api/main.ts').read_text()
          assert 'Unified full-canvas layout · 2026-09-17' in s
          assert 'nav{background:transparent!important' in s
          assert '.home-only .experience-hero{min-height:100svh;display:flex;align-items:center}' in s
          assert '.home-only .sim-shell{max-width:1180px' in s
          assert 'background-attachment:fixed' in s
          PY
      - run: npm ci
      - run: npm test
      - name: Commit validated update
        run: |
          rm .github/workflows/ui-full-canvas.yml
          rm .github/scripts/ui_full_canvas.py
          git config user.name 'Link2AI UI Polish'
          git config user.email 'actions@users.noreply.github.com'
          git add src/api/main.ts .github/workflows/ui-full-canvas.yml .github/scripts/ui_full_canvas.py
          git commit -m 'Fill homepage canvas and unify page backgrounds'
          git push origin HEAD:ui-full-canvas
