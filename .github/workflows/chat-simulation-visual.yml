name: Chat simulation visual validation

on:
  push:
    branches: ["chat-simulation-polish"]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Capture simulation screenshots
        shell: bash
        run: |
          mkdir -p visual-artifacts
          export NODE_ENV=production
          export PORT=3210
          export DATABASE_URL=postgres://127.0.0.1:1/link2ai
          export PUBLIC_BASE_URL=http://127.0.0.1:3210
          export PUBLIC_BRAND_NAME=Link2AI
          export RAILWAY_PUBLIC_DOMAIN=127.0.0.1
          export APP_SECRET=01234567890123456789012345678901
          export REVIEWER_EMAIL=reviewer@example.com
          export REVIEWER_PASSWORD=this-is-a-long-review-password
          export FOUNDER_EMAIL=founder@example.com
          node dist/src/api/main.js >/tmp/link2ai-chat-visual.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:3210/healthz >/dev/null; then break; fi
            sleep .25
          done
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=3000 http://127.0.0.1:3210/#simulation visual-artifacts/chat-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=3000 http://127.0.0.1:3210/#simulation visual-artifacts/chat-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: chat-simulation-screenshots
          path: visual-artifacts/*.png
          if-no-files-found: error
