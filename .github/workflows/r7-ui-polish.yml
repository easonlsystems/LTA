name: R7 UI polish

on:
  push:
    branches:
      - r7-ui-polish-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply UI patch
        run: python3 scripts/r7_ui_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Run full regression
        run: npm test

      - name: Commit validated UI patch
        run: |
          git config user.name "easonsystems"
          git config user.email "easonlsy1019@gmail.com"
          git rm .github/workflows/r7-ui-polish.yml scripts/r7_ui_patch.py
          git add src/api/main.ts
          git diff --cached --check
          git commit -m "Polish website wrapping and Founder dashboard UI"
          git push origin HEAD:r7-ui-polish-20260916
