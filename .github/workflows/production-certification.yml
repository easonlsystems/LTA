name: Production certification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-certification
  cancel-in-progress: true

jobs:
  public-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for production and certify public surface
        env:
          LINK2AI_PRODUCTION_URL: https://api-production-0383e.up.railway.app
          LINK2AI_PROD_CERT_ATTEMPTS: 40
          LINK2AI_PROD_CERT_DELAY_MS: 15000
          LINK2AI_EXPECTED_REVISION: ${{ github.sha }}
        run: node test/production-public-cert.mjs
