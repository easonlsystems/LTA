name: R14 production acceptance

on:
  push:
    branches: ["verify/r14-production-20260917"]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production homepage and runtime gate
        shell: bash
        env:
          BASE_URL: https://api-production-0383e.up.railway.app
        run: |
          set -euo pipefail
          fetch() { curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 "$1"; }
          require_contains() {
            local label="$1" content="$2" needle="$3"
            if ! grep -Fq -- "$needle" <<<"$content"; then
              echo "FAIL: $label missing: $needle" >&2
              exit 1
            fi
            echo "PASS: $label"
          }
          require_absent() {
            local label="$1" content="$2" needle="$3"
            if grep -Fq -- "$needle" <<<"$content"; then
              echo "FAIL: $label unexpectedly contains: $needle" >&2
              exit 1
            fi
            echo "PASS: $label"
          }

          health="$(fetch "$BASE_URL/healthz")"
          require_contains health "$health" '"ok":true'

          ready="$(fetch "$BASE_URL/readyz")"
          require_contains readiness "$ready" '"ok":true'

          home="$(fetch "$BASE_URL/")"
          require_contains homepage_asset "$home" 'home.js?v=20260917-r14'
          require_contains homepage_tab "$home" 'Reddit · paused'
          require_contains homepage_usecase_pause "$home" 'Reddit · temporarily paused.'
          require_absent homepage_active_reddit_claim "$home" 'Summarize this Reddit thread.'

          js="$(fetch "$BASE_URL/home.js?v=20260917-r14")"
          require_contains runtime_availability "$js" 'const redditAvailable=false;'
          require_contains runtime_hard_gate "$js" "state.source==='reddit'&&!redditAvailable"
          require_contains runtime_oauth_message "$js" 'Approved OAuth access required'
          echo 'R14 production acceptance passed.'
